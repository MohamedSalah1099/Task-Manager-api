spring:
  application:
    name: task-manager-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/task_manager_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Vexx1324}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true
    defer-datasource-initialization: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8080
  servlet:
    context-path: /api/v1

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

application:
  jwt:
    secret: ${JWT_SECRET:r/z9xCYL8sl2L8uaY64jjd8i29yRUVwrZSHig88kQOO5Ni0CPL9A51GgBxpnX2nVSHI0jPLy1yYm4AnYUxmavA==}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

logging:
  level:
    com.mohamedsalah.taskmanager: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.security: DEBUG
